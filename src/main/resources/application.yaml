server:
  port: 8080

spring:
  application:
    name: relations

  datasource:
    url: jdbc:postgresql://${DB_CONNECTION_HOST:localhost}:${DB_CONNECTION_PORT:5432}/${DB_NAME:relations}
    username: ${DB_USERNAME:relations}
    password: ${DB_PASSWORD:relations}

  jpa:
    open-in-view: false

    hibernate:
      ddl-auto: update
    properties:
      hibernate:
        format_sql: true

